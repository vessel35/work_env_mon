<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #F5F6F7; }
    a { color: #B4262A; } a:hover { color: #8C1D20; }
    .sheet { font-family: "IBM Plex Sans KR", -apple-system, system-ui, sans-serif; color: #14161A; padding: 32px; box-sizing: border-box; min-height: 100%; }
    .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B7079; }
    .rule { height: 1px; background: #D5D8DC; border: 0; margin: 0; }
    .cap { font-size: 10px; color: #7A7F87; text-align: center; margin-top: 8px; }
  </style>
</helmet>
<div class="sheet">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <symbol id="d-block" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" d="M12 3.4A8.6 8.6 0 1 1 11.99 3.4Z"></path><path fill="currentColor" d="M12 12L12 4.6A7.4 7.4 0 0 1 18.41 15.7Z"></path></symbol>
      <symbol id="d-allow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" d="M12 3.4A8.6 8.6 0 1 1 11.99 3.4Z"></path><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 7.2V12L15.4 14"></path></symbol>
      <mask id="cut-off" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
        <rect x="0" y="0" width="24" height="24" fill="#fff"></rect>
        <path fill="none" stroke="#000" stroke-width="4.2" stroke-linecap="round" d="M6.3 6.3L17.7 17.7"></path>
      </mask>
      <symbol id="d-off" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" mask="url(#cut-off)" d="M12 3.4A8.6 8.6 0 1 1 11.99 3.4Z"></path>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6.3 6.3L17.7 17.7"></path>
      </symbol>
      <symbol id="d-warn" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M12 3.4A8.6 8.6 0 1 1 11.99 3.4Z M10.85 7.6A1.15 1.15 0 0 1 13.15 7.6V12.6A1.15 1.15 0 0 1 10.85 12.6Z M13.3 16.1A1.3 1.3 0 1 1 10.7 16.1A1.3 1.3 0 1 1 13.3 16.1Z"></path></symbol>
    </defs>
  </svg>

  <div class="eyebrow" style="margin-bottom: 6px">다른 방향</div>
  <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">시간표</div>
  <div style="font-size: 12px; color: #4A4F57; margin-top: 6px; line-height: 1.55">둥근 시계에 막히는 시간대를 칠합니다. 이 프로그램만의 성질인 정해진 시간을 앞세운 방향입니다.</div>

  <hr class="rule" style="margin: 20px 0">

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
    <div><svg style="width: 100%; height: 62px; color: #FF383C"><use href="#d-block"></use></svg><div class="cap">차단 중</div></div>
    <div><svg style="width: 100%; height: 62px; color: #34C658"><use href="#d-allow"></use></svg><div class="cap">허용 중</div></div>
    <div><svg style="width: 100%; height: 62px; color: #8E8E92"><use href="#d-off"></use></svg><div class="cap">꺼짐</div></div>
    <div><svg style="width: 100%; height: 62px; color: #FF8D28"><use href="#d-warn"></use></svg><div class="cap">이상</div></div>
  </div>

  <div style="display: flex; align-items: center; gap: 20px; background: #2A2C30; padding: 0 18px; height: 42px; margin-top: 22px">
    <svg style="width: 18px; height: 18px; color: #FF383C"><use href="#d-block"></use></svg>
    <svg style="width: 18px; height: 18px; color: #34C658"><use href="#d-allow"></use></svg>
    <svg style="width: 18px; height: 18px; color: #8E8E92"><use href="#d-off"></use></svg>
    <svg style="width: 18px; height: 18px; color: #FF8D28"><use href="#d-warn"></use></svg>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8C919A; margin-left: auto">18pt</div>
  </div>

  <hr class="rule" style="margin: 22px 0 16px">

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div>
      <div class="eyebrow" style="margin-bottom: 5px">얻는 것</div>
      <div style="font-size: 12px; color: #14161A; line-height: 1.55">칠해진 넓이로 얼마나 오래 막히는지까지 짐작됩니다. 시간표를 다루는 프로그램이라는 성질이 드러납니다.</div>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom: 5px">잃는 것</div>
      <div style="font-size: 12px; color: #4A4F57; line-height: 1.55">지금 막히는 중인지가 한눈에 안 옵니다. 작은 크기에서 칠한 조각의 각도를 읽기 어렵습니다.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
