<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #F5F6F7; }
    a { color: #B4262A; } a:hover { color: #8C1D20; }
    .sheet { font-family: "IBM Plex Sans KR", -apple-system, system-ui, sans-serif; color: #14161A; padding: 32px; box-sizing: border-box; min-height: 100%; }
    .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B7079; }
    .rule { height: 1px; background: #D5D8DC; border: 0; margin: 0; }
    .cap { font-size: 10px; color: #7A7F87; text-align: center; margin-top: 8px; }
  </style>
</helmet>
<div class="sheet">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute">
    <defs>
      <symbol id="d-block" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M4.8 4H19.2A1.6 1.6 0 0 1 20.8 5.6V18.4A1.6 1.6 0 0 1 19.2 20H4.8A1.6 1.6 0 0 1 3.2 18.4V5.6A1.6 1.6 0 0 1 4.8 4Z M3.2 9.1H20.8V10.3H3.2Z M3.2 13.7H20.8V14.9H3.2Z"></path></symbol>
      <symbol id="d-allow" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4.8 4H19.2A1.6 1.6 0 0 1 20.8 5.6V18.4A1.6 1.6 0 0 1 19.2 20H4.8A1.6 1.6 0 0 1 3.2 18.4V5.6A1.6 1.6 0 0 1 4.8 4Z"></path><path fill="currentColor" d="M5.8 6.4H18.2V7.8H5.8Z M5.8 8.9H18.2V10.3H5.8Z"></path></symbol>
      <mask id="cut-off" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
        <rect x="0" y="0" width="24" height="24" fill="#fff"></rect>
        <path fill="none" stroke="#000" stroke-width="4.2" stroke-linecap="round" d="M6 6L18 18"></path>
      </mask>
      <symbol id="d-off" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" mask="url(#cut-off)" d="M4.8 4H19.2A1.6 1.6 0 0 1 20.8 5.6V18.4A1.6 1.6 0 0 1 19.2 20H4.8A1.6 1.6 0 0 1 3.2 18.4V5.6A1.6 1.6 0 0 1 4.8 4Z"></path>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6L18 18"></path>
      </symbol>
      <symbol id="d-warn" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M4.8 4H19.2A1.6 1.6 0 0 1 20.8 5.6V18.4A1.6 1.6 0 0 1 19.2 20H4.8A1.6 1.6 0 0 1 3.2 18.4V5.6A1.6 1.6 0 0 1 4.8 4Z M10.85 7.4A1.15 1.15 0 0 1 13.15 7.4V12.4A1.15 1.15 0 0 1 10.85 12.4Z M13.3 15.9A1.3 1.3 0 1 1 10.7 15.9A1.3 1.3 0 1 1 13.3 15.9Z"></path></symbol>
    </defs>
  </svg>

  <div class="eyebrow" style="margin-bottom: 6px">다른 방향</div>
  <div style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">셔터</div>
  <div style="font-size: 12px; color: #4A4F57; margin-top: 6px; line-height: 1.55">내려오는 셔터로 막습니다. 시간이 되면 닫히고 지나면 열리는 움직임을 그대로 형상으로 옮긴 방향입니다.</div>

  <hr class="rule" style="margin: 20px 0">

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
    <div><svg style="width: 100%; height: 62px; color: #FF383C"><use href="#d-block"></use></svg><div class="cap">차단 중</div></div>
    <div><svg style="width: 100%; height: 62px; color: #34C658"><use href="#d-allow"></use></svg><div class="cap">허용 중</div></div>
    <div><svg style="width: 100%; height: 62px; color: #8E8E92"><use href="#d-off"></use></svg><div class="cap">꺼짐</div></div>
    <div><svg style="width: 100%; height: 62px; color: #FF8D28"><use href="#d-warn"></use></svg><div class="cap">이상</div></div>
  </div>

  <div style="display: flex; align-items: center; gap: 20px; background: #2A2C30; padding: 0 18px; height: 42px; margin-top: 22px">
    <svg style="width: 18px; height: 18px; color: #FF383C"><use href="#d-block"></use></svg>
    <svg style="width: 18px; height: 18px; color: #34C658"><use href="#d-allow"></use></svg>
    <svg style="width: 18px; height: 18px; color: #8E8E92"><use href="#d-off"></use></svg>
    <svg style="width: 18px; height: 18px; color: #FF8D28"><use href="#d-warn"></use></svg>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8C919A; margin-left: auto">18pt</div>
  </div>

  <hr class="rule" style="margin: 22px 0 16px">

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div>
      <div class="eyebrow" style="margin-bottom: 5px">얻는 것</div>
      <div style="font-size: 12px; color: #14161A; line-height: 1.55">막는다는 동작 자체가 보입니다. 다른 차단 도구와 겹치지 않는 모양이라 기억에 남습니다.</div>
    </div>
    <div>
      <div class="eyebrow" style="margin-bottom: 5px">잃는 것</div>
      <div style="font-size: 12px; color: #4A4F57; line-height: 1.55">네모난 실루엣이 메뉴 바의 다른 상자꼴 아이콘과 섞입니다. 열림과 닫힘의 차이가 18pt 에서 약합니다.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
